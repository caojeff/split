<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>AA分账工具 Pro（选择器版）</title>

<style>
body { font-family: -apple-system; background:#f5f6fa; padding:20px; }
.container { max-width:800px; margin:auto; }

.card {
  background:#fff;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

input {
  width:100%; padding:10px; margin:5px 0;
  border-radius:6px; border:1px solid #ddd;
}

button {
  width:100%; padding:10px; margin-top:10px;
  border:none; border-radius:6px;
  background:#1677ff; color:#fff;
}

button.delete {
  background:red; width:auto; padding:5px 10px;
}

.person-tag {
  display:inline-block;
  padding:5px 10px;
  margin:3px;
  background:#eee;
  border-radius:20px;
  cursor:pointer;
}

.person-tag.active {
  background:#1677ff;
  color:#fff;
}
</style>
</head>

<body>

<div class="container">

<h2>💰 AA分账工具（智能版）</h2>

<div class="card">

<input type="date" id="date">
<input id="project" placeholder="项目">
<input id="payer" placeholder="付款人">
<input id="amount" type="number" placeholder="金额">

<input id="peopleInput" placeholder="参与人（可输入或点击下面选择）">

<div id="personSelector"></div>

<button onclick="addExpense()">添加消费</button>

</div>

<div class="card">
<h3>消费记录</h3>
<div id="list"></div>
</div>

<div class="card">
<button onclick="calculate()">一键结算</button>
</div>

<div class="card">
<h3>项目结算</h3>
<div id="projectResult"></div>
</div>

<div class="card">
<h3>最终结果</h3>
<div id="result"></div>
</div>

</div>

<script>

// ===== 内存数据（无缓存版）=====
let expenses = [];
let peopleDB = new Set();

function renderSelector(){
  let html="";
  peopleDB.forEach(p=>{
    html+=`<span class="person-tag" onclick="togglePerson(this,'${p}')">${p}</span>`;
  });
  document.getElementById("personSelector").innerHTML=html;
}

function togglePerson(el,name){
  el.classList.toggle("active");

  let input=document.getElementById("peopleInput");
  let list=input.value.replace(/，/g,",").split(",").map(x=>x.trim()).filter(x=>x);

  if(el.classList.contains("active")){
    if(!list.includes(name)) list.push(name);
  }else{
    list=list.filter(x=>x!==name);
  }

  input.value=list.join(",");
}

function render(){
  let html="";
  expenses.forEach((e,i)=>{
    html+=`
    <div>
      ${e.date} | [${e.project}] ${e.payer}：${e.amount}<br>
      <span style="color:#888;">参与人：${e.people.join(", ")}</span>
      <button class="delete" onclick="remove(${i})">删</button>
    </div><hr>`;
  });
  document.getElementById("list").innerHTML=html;
}

function remove(i){
  expenses.splice(i,1);
  render();
}

function addExpense(){

  let date=dateVal();
  let project=val("project");
  let payer=val("payer");
  let amount=parseFloat(val("amount"));
  let peopleRaw=val("peopleInput");

  if(!date||!project||!payer||!amount||!peopleRaw){
    alert("请填写完整");
    return;
  }

  let people=peopleRaw.replace(/，/g,",")
    .split(",")
    .map(p=>p.trim())
    .filter(p=>p);

  // 去重
  people=[...new Set(people)];

  // 自动包含付款人
  if(!people.includes(payer)) people.push(payer);

  // 更新数据库
  people.forEach(p=>peopleDB.add(p));
  peopleDB.add(payer);

  renderSelector();

  expenses.push({date,project,payer,amount,people});

  render();

  clearInputs();
}

function calculate(){

  let debtMap={};
  let projectHTML="";

  function addDebt(a,b,amt){
    if(a===b)return;
    if(!debtMap[a])debtMap[a]={};
    if(!debtMap[a][b])debtMap[a][b]=0;
    debtMap[a][b]+=amt;
  }

  expenses.forEach(e=>{
    let total=Math.round(e.amount*100);
    let share=Math.floor(total/e.people.length);

    let temp={};
    e.people.forEach(p=>temp[p]=-share);
    temp[e.payer]+=total;

    let d=[],c=[];
    for(let p in temp){
      if(temp[p]<0)d.push({n:p,a:-temp[p]});
      else if(temp[p]>0)c.push({n:p,a:temp[p]});
    }

    let res="",i=0,j=0;

    while(i<d.length && j<c.length){
      let pay=Math.min(d[i].a,c[j].a);

      addDebt(d[i].n,c[j].n,pay);

      res+=`${d[i].n} ➜ ${c[j].n}：${(pay/100).toFixed(2)}<br>`;

      d[i].a-=pay; c[j].a-=pay;

      if(d[i].a===0)i++;
      if(c[j].a===0)j++;
    }

    projectHTML+=`<div><b>${e.project}</b><br>${res}</div>`;
  });

  document.getElementById("projectResult").innerHTML=projectHTML;

  // 抵消
  let final={};

  for(let a in debtMap){
    for(let b in debtMap[a]){
      let net=debtMap[a][b]-(debtMap[b]?.[a]||0);
      if(net>0){
        if(!final[a])final[a]={};
        final[a][b]=net;
      }
    }
  }

  let res="";
  for(let a in final){
    for(let b in final[a]){
      res+=`${a} ➜ ${b}：${(final[a][b]/100).toFixed(2)}<br>`;
    }
  }

  document.getElementById("result").innerHTML=res||"已平账";
}

// ===== 工具函数 =====
function val(id){ return document.getElementById(id).value.trim(); }
function dateVal(){ return document.getElementById("date").value; }

function clearInputs(){
  ["date","project","payer","amount","peopleInput"].forEach(id=>{
    document.getElementById(id).value="";
  });
}

// 初始化
renderSelector();

</script>

</body>
</html>
