<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>AA分账工具 Pro（无缓存版）</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont;
  background: #f5f6fa;
  margin: 0;
  padding: 20px;
}
.container { max-width: 800px; margin: auto; }
.card {
  background: #fff;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}
h2 { text-align: center; }
input {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
  border-radius: 6px;
  border: 1px solid #ddd;
}
button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border: none;
  border-radius: 6px;
  background: #1677ff;
  color: white;
}
button.delete {
  background: red;
  width: auto;
  padding: 5px 10px;
  font-size: 12px;
}
.item {
  display: flex;
  justify-content: space-between;
  margin-top: 5px;
}
.result { color: green; font-weight: bold; }
</style>
</head>

<body>

<div class="container">
<h2>💰 AA分账工具（新会话版）</h2>

<div class="card">
  <input type="date" id="date">
  <input id="project" placeholder="项目">
  <input id="payer" placeholder="付款人">
  <input id="amount" type="number" placeholder="金额">
  <input id="people" placeholder="参与人（支持中文逗号）">
  <button onclick="addExpense()">添加</button>
</div>

<div class="card">
  <h3>消费记录</h3>
  <div id="list"></div>
</div>

<div class="card">
  <button onclick="calculate()">一键结算</button>
</div>

<div class="card">
  <h3>项目结算</h3>
  <div id="projectResult"></div>
</div>

<div class="card">
  <h3>最终结果</h3>
  <div id="result" class="result"></div>
</div>

</div>

<script>

// ✅ 页面打开自动清缓存
localStorage.removeItem("expenses");

let expenses = [];

function render(){
  let html = "";
  expenses.forEach((e,i)=>{
    html += `
      <div class="item">
        <div>${e.date} | [${e.project}] ${e.payer}：${e.amount}</div>
        <button class="delete" onclick="remove(${i})">删</button>
      </div>`;
  });
  document.getElementById("list").innerHTML = html;
}

function remove(i){
  expenses.splice(i,1);
  render();
}

function addExpense(){
  let date = document.getElementById("date").value;
  let project = document.getElementById("project").value.trim();
  let payer = document.getElementById("payer").value.trim();
  let amount = parseFloat(document.getElementById("amount").value);
  let peopleRaw = document.getElementById("people").value.trim();

  if(!date || !project || !payer || !amount || !peopleRaw){
    alert("请填写完整");
    return;
  }

  let people = peopleRaw
    .replace(/，/g,",")
    .split(",")
    .map(p=>p.trim())
    .filter(p=>p);

  expenses.push({date,project,payer,amount,people});
  render();

  document.getElementById("date").value="";
  document.getElementById("project").value="";
  document.getElementById("payer").value="";
  document.getElementById("amount").value="";
  document.getElementById("people").value="";
}

function calculate(){

  let finalBalance = {};
  let projectHTML = "";

  expenses.forEach(e=>{
    let total = Math.round(e.amount*100);
    let share = Math.floor(total/e.people.length);

    let balance = {};

    e.people.forEach(p=>{
      balance[p]=0;
      if(!finalBalance[p]) finalBalance[p]=0;
    });

    if(!balance[e.payer]) balance[e.payer]=0;
    if(!finalBalance[e.payer]) finalBalance[e.payer]=0;

    balance[e.payer]+=total;
    e.people.forEach(p=> balance[p]-=share);

    for(let p in balance){
      finalBalance[p]+=balance[p];
    }

    let d=[],c=[];
    for(let p in balance){
      if(balance[p]<0) d.push({n:p,a:-balance[p]});
      else if(balance[p]>0) c.push({n:p,a:balance[p]});
    }

    let res="",i=0,j=0;
    while(i<d.length && j<c.length){
      let pay=Math.min(d[i].a,c[j].a);
      res+=`${d[i].n} ➜ ${c[j].n}：${(pay/100).toFixed(2)}<br>`;
      d[i].a-=pay; c[j].a-=pay;
      if(d[i].a===0)i++;
      if(c[j].a===0)j++;
    }

    projectHTML+=`<div><b>${e.project}</b><br>${res}</div>`;
  });

  document.getElementById("projectResult").innerHTML = projectHTML;

  let d=[],c=[];
  for(let p in finalBalance){
    if(finalBalance[p]<0)d.push({n:p,a:-finalBalance[p]});
    else if(finalBalance[p]>0)c.push({n:p,a:finalBalance[p]});
  }

  let res="",i=0,j=0;
  while(i<d.length && j<c.length){
    let pay=Math.min(d[i].a,c[j].a);
    res+=`${d[i].n} ➜ ${c[j].n}：${(pay/100).toFixed(2)}<br>`;
    d[i].a-=pay; c[j].a-=pay;
    if(d[i].a===0)i++;
    if(c[j].a===0)j++;
  }

  document.getElementById("result").innerHTML = res || "已平账";
}

</script>

</body>
</html>
