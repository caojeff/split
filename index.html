<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>AA分账工具</title>
<style>
body { font-family: Arial; max-width: 800px; margin: auto; }
input, button { padding: 6px; margin: 5px; }
table { border-collapse: collapse; width: 100%; margin-top: 10px;}
td, th { border: 1px solid #ccc; padding: 8px; text-align: center;}
</style>
</head>

<body>

<h2>💰 AA分账工具</h2>

<h3>添加消费</h3>
<input id="payer" placeholder="付款人">
<input id="amount" type="number" placeholder="金额">
<input id="people" placeholder="参与人(用逗号分隔)">
<button onclick="addExpense()">添加</button>

<table id="expenseTable">
<tr><th>付款人</th><th>金额</th><th>参与人</th></tr>
</table>

<button onclick="calculate()">一键结算</button>

<h3>结算结果</h3>
<div id="result"></div>

<script>
let expenses = [];

function addExpense(){
    let payer = document.getElementById("payer").value;
    let amount = parseFloat(document.getElementById("amount").value);
    let people = document.getElementById("people").value.split(",");

    expenses.push({payer, amount, people});

    let table = document.getElementById("expenseTable");
    let row = table.insertRow();
    row.insertCell(0).innerText = payer;
    row.insertCell(1).innerText = amount;
    row.insertCell(2).innerText = people.join(",");

    document.getElementById("payer").value="";
    document.getElementById("amount").value="";
    document.getElementById("people").value="";
}

function calculate(){
    let balance = {};

    expenses.forEach(e=>{
        let share = e.amount / e.people.length;
        e.people.forEach(p=>{
            balance[p] = (balance[p] || 0) - share;
        });
        balance[e.payer] += e.amount;
    });

    let debtors = [];
    let creditors = [];

    for(let p in balance){
        if(balance[p] < 0){
            debtors.push({name:p, amt:-balance[p]});
        } else if(balance[p] > 0){
            creditors.push({name:p, amt:balance[p]});
        }
    }

    let result = "";
    let i=0, j=0;

    while(i<debtors.length && j<creditors.length){
        let pay = Math.min(debtors[i].amt, creditors[j].amt);

        result += `${debtors[i].name} ➜ ${creditors[j].name} ：${pay.toFixed(2)}<br>`;

        debtors[i].amt -= pay;
        creditors[j].amt -= pay;

        if(debtors[i].amt===0) i++;
        if(creditors[j].amt===0) j++;
    }

    document.getElementById("result").innerHTML = result;
}
</script>

</body>
</html>
